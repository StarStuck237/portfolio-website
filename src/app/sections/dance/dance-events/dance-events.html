@if (events().length) {
  <!-- Same anatomy as the See it move header one level down from the section heading. -->
  <div class="flex flex-col lg:flex-row lg:items-baseline lg:gap-[22px]">
    <span class="font-mono text-[11px] tracking-[0.2em] uppercase text-label" aria-hidden="true">
      Upcoming
    </span>
    <h3
      class="mt-2.5 font-display text-2xl uppercase text-paper lg:mt-0 lg:whitespace-nowrap lg:text-[26px]"
    >
      Where I'll be
    </h3>
    <span
      class="mt-[18px] h-px w-full bg-rule-section lg:mt-0 lg:w-0 lg:grow"
      aria-hidden="true"
    ></span>
  </div>

  <div class="mt-7 lg:mt-10">
    @for (event of events(); track event.id) {
      <a
        [href]="event.url"
        target="_blank"
        rel="noopener noreferrer"
        class="stop group flex items-baseline gap-4 pb-[30px] lg:gap-[35px] lg:pb-11"
      >
        <span
          class="tick transition-colors"
          [class.bg-accent]="event.next"
          [class.bg-rule-strong]="!event.next"
          [class.group-hover:bg-paper]="!event.next"
          aria-hidden="true"
        ></span>

        <p
          class="date font-mono text-[11px] tracking-[0.1em] uppercase lg:text-xs"
          [class.text-accent]="event.next"
          [class.text-label]="!event.next"
        >
          {{ event.when }}
        </p>

        <p class="days font-mono text-[10px] tracking-[0.1em] uppercase text-label lg:text-[11px]">
          @if (event.countdownValue) {
            <span class="text-[14px] text-count lg:text-[20px]">{{ event.countdownValue }}</span>
          }
          {{ event.countdownLabel }}
        </p>

        <div class="body">
          <h4
            class="name mt-2 font-display text-2xl leading-[1.05] tracking-[0.005em] uppercase text-paper transition-colors group-hover:text-accent lg:mt-0 lg:leading-none"
          >
            {{ event.name }}
          </h4>
          <p class="mt-[7px] font-mono text-[11px] tracking-[0.1em] uppercase text-label lg:mt-2.5">
            {{ event.city }}
          </p>
        </div>

        <span
          class="hidden w-5 shrink-0 text-right font-mono text-[15px] text-rule-strong transition-colors group-hover:text-paper lg:block"
          aria-hidden="true"
          >&#8599;</span
        >
      </a>
    }
  </div>
}
