<div
  class="group relative flex flex-col gap-3 py-[22px] transition-colors lg:flex-row lg:gap-10 lg:py-[34px]"
  [class]="
    current()
      ? 'border-l-[3px] border-accent bg-surface pr-5 pl-[17px] lg:pr-[30px] lg:pl-[26px]'
      : 'border-t border-rule hover:bg-surface/70 lg:px-[29px]'
  "
>
  @if (job().url) {
    <a
      [href]="job().url"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="job().role + ' at ' + job().company"
      class="absolute inset-0"
    ></a>
  }

  <p
    class="font-mono text-[11px] tracking-[0.1em] uppercase text-label lg:w-[168px] lg:shrink-0 lg:pt-1.5 lg:text-xs"
  >
    {{ job().dateRange }}
  </p>

  <div class="flex flex-col gap-3 lg:grow lg:gap-3.5">
    <h3
      class="font-display text-2xl leading-[1.05] tracking-[0.005em] uppercase text-paper lg:text-3xl lg:leading-none"
    >
      {{ job().role }}
      <span
        class="lg:before:content-['·_']"
        [class]="current() ? 'text-accent' : 'text-label transition-colors group-hover:text-paper'"
      >
        {{ job().company }}
      </span>
    </h3>
    <p class="max-w-[760px] text-[15px] leading-[1.7] text-body lg:text-base">
      {{ job().summary }}
    </p>
    <div class="mt-0.5 lg:mt-1">
      <app-tech-pill-list [items]="job().techStack" />
    </div>
  </div>
</div>
