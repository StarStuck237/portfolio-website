<section
  id="experience"
  appObserveSection
  aria-labelledby="experience-heading"
  class="mb-8 scroll-mt-16 lg:mb-16"
>
  <app-section-heading index="02" title="Experience" headingId="experience-heading" />
  <div class="mt-6 space-y-4">
    @for (job of jobs; track job.id) {
      <app-experience-item [job]="job" />
    }
  </div>
</section>
