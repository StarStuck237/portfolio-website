<div class="flex h-full flex-col gap-4 border border-rule bg-surface p-6 lg:p-8">
  <h3 class="font-display text-2xl uppercase text-paper lg:text-[26px]">{{ project().name }}</h3>
  <ul class="flex flex-col gap-2">
    @for (highlight of project().highlights; track highlight) {
      <li class="text-[15px] leading-[1.7] text-body">{{ highlight }}</li>
    }
  </ul>
  <div class="mt-auto pt-1">
    <app-tech-pill-list [items]="project().techStack" />
  </div>
</div>
