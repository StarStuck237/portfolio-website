<div class="rounded-md bg-slate-800/50 p-6 transition-colors hover:bg-slate-800">
  <h3 class="font-semibold text-slate-200">{{ project().name }}</h3>
  <ul class="mt-3 space-y-2">
    @for (highlight of project().highlights; track highlight) {
      <li class="flex items-baseline gap-2 text-sm leading-relaxed">
        <span class="text-teal-300" aria-hidden="true">▹</span>
        <span>{{ highlight }}</span>
      </li>
    }
  </ul>
  <div class="mt-4">
    <app-tech-pill-list [items]="project().techStack" />
  </div>
</div>
