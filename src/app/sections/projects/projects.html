<section
  id="projects"
  appObserveSection
  aria-labelledby="projects-heading"
  class="mb-8 lg:mb-16"
>
  <app-section-heading index="03" title="Projects" headingId="projects-heading" />
  <div class="mt-6 space-y-2">
    @for (project of projects; track project.id) {
      <app-project-card [project]="project" />
    }
  </div>
</section>
