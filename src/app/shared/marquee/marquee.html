<div
  class="w-[112%] -translate-x-[6%] -rotate-1 overflow-hidden bg-accent py-3 lg:py-[18px]"
  aria-hidden="true"
>
  <div class="marquee-track flex w-max">
    @for (half of halves; track half) {
      <div class="flex shrink-0 items-center">
        @for (word of words; track word) {
          <span
            class="px-4 font-display text-xl uppercase tracking-[0.02em] whitespace-nowrap text-ink lg:px-6 lg:text-3xl"
          >
            {{ word }}
          </span>
          <span class="text-base text-ink/70 lg:text-xl">&#10022;</span>
        }
      </div>
    }
  </div>
</div>
