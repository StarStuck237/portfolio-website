<ul class="flex flex-wrap gap-x-[22px] gap-y-1 lg:flex-col lg:gap-3">
  @for (link of links(); track link.href) {
    <li>
      <a
        [href]="link.href"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-block py-3 font-mono text-sm tracking-[0.04em] text-paper transition-colors hover:text-accent lg:py-0 lg:text-[15px] lg:tracking-[0.06em]"
      >
        {{ link.label }} <span aria-hidden="true">&#8599;</span>
      </a>
    </li>
  }
</ul>
